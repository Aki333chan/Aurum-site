server {
    listen 80;
    listen [::]:80;
    server_name aurumgg.ovh www.aurumgg.ovh;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aurumgg.ovh$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aurumgg.ovh;
    ssl_certificate /etc/letsencrypt/live/aurumgg.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurumgg.ovh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://aurumgg.ovh$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurumgg.ovh;
    root /opt/aurum-site/apps/web/dist;
    index index.html;
    client_max_body_size 3m;
    ssl_certificate /etc/letsencrypt/live/aurumgg.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurumgg.ovh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
